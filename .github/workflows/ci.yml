name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # tsc --noEmit. The tree is at zero errors, so any new one fails here.
      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Ratchet, not an aspiration: the threshold in .jscpd.json sits just
      # above today's ratio so a REGRESSION fails while the existing debt
      # stays visible. Lower it as duplication comes down; never raise it to
      # make a red build green.
      - name: Duplication check
        run: npx jscpd

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # The E2E suite needs a running backend and a database, which this
    # workflow does not provision. Enable by setting the repository variable
    # RUN_E2E to "true" once a test backend is reachable from CI; until then
    # the job is skipped rather than failing every PR on infrastructure.
    if: vars.RUN_E2E == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_API_URL: ${{ secrets.E2E_API_URL }}
